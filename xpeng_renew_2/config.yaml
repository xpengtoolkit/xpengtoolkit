# A second slot of the same app, for a second car on its own XPENG account.
#
# The worker is identical, so this directory is packaging only: there is no copy of
# renew_server.py here, and that is deliberate. Differences from xpeng_renew:
#   * slug / name / description;
#   * `image:` instead of a Dockerfile — the Renewal image workflow already
#     publishes the worker, and the Supervisor pulls that image tagged with
#     `version`. A copied Dockerfile would need the Playwright base and npm
#     install again, and a copied worker is how two apps drift apart;
#   * host port 8091 (the worker still listens on 8090 inside the container);
#   * `pair_dir` defaults to /config/xpeng-secrets-2.
# tests/test_addon_slots.py keeps version, options and schema in step with
# xpeng_renew/config.yaml.
name: XPENG credential renewal (2nd car)
version: "0.1.23"
slug: xpeng_renew_2
description: >-
  A second instance of XPENG credential renewal, for a second car on its own XPENG
  account. The same worker and the same published image as the first app; only the
  defaults differ - host port 8091 and pair_dir /config/xpeng-secrets-2. Give it the
  second account's email and password, leave entry_id empty, and the pair's VIN
  selects its own config entry.
url: https://github.com/xpengtoolkit/xpengtoolkit
image: ghcr.io/xpengtoolkit/xpeng-renew
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Same grant as the first slot: the run ends by importing the fresh pair through the
# Supervisor's Core proxy (POST /core/api/services/xpeng/import_credentials), and
# without it every import answers 401 Unauthorized after a renewal that succeeded.
homeassistant_api: true
map:
  - config:rw
ports:
  "8090/tcp": 8091
ports_description:
  "8090/tcp": Renewal API - POST /renew, GET /healthz (host port 8091)
options:
  email: ""
  password: ""
  device_id: ""
  # Only needed if the token file has no VIN (the tool records one).
  vin: ""
  renew_interval: 6000
  invalid_poll_interval: 300
  solver_url: "http://571f4c18-xpeng-slider-solver:8080"
  solver_token: ""
  renew_token: ""
  notify_on_success: true
  # This slot's own pair directory. The first slot uses /config/xpeng-secrets, and
  # two instances sharing one directory overwrite each other's pair.
  pair_dir: "/config/xpeng-secrets-2"
  # Leave empty: the pair's VIN selects its own entry, and a readable VIN that
  # matches no entry makes the app bootstrap one instead of importing into another
  # car's entry. Set it only for a renamed entry.
  entry_id: ""
  command_mode: safe_plus
schema:
  email: email
  password: password
  device_id: str?
  vin: str?
  renew_interval: int?
  invalid_poll_interval: int?
  solver_url: url
  solver_token: password
  renew_token: password
  notify_on_success: bool?
  pair_dir: str
  entry_id: str?
  command_mode: list(read_only|safe|safe_plus|charging|full)
