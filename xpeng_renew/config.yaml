name: XPENG credential renewal
version: "0.1.23"
slug: xpeng_renew
description: >-
  Renews XPENG credentials unattended. Solves the login slider through the solver
  add-on, then imports the fresh pair - and on an install with no config entry yet it
  creates that entry itself by driving the config flow, because
  xpeng.import_credentials does not exist until an entry does. Nothing needs a human.
  When it creates the entry it also sets the integration's command permissions from the
  `command_mode` option below - Safe Plus by default, so nothing can unlock the car.
url: https://github.com/xpengtoolkit/xpengtoolkit
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# The run ends by importing the fresh pair through the Supervisor's Core proxy
# (POST /core/api/services/xpeng/import_credentials), and it reports failures the
# same way. Without this grant the Supervisor answers every such call with
# 401 Unauthorized - after a renewal that otherwise succeeded, which makes it
# look like a credential problem rather than a permissions one.
homeassistant_api: true
map:
  - config:rw
ports:
  "8090/tcp": 8090
ports_description:
  "8090/tcp": Renewal API - POST /renew, GET /healthz
options:
  email: ""
  password: ""
  device_id: ""
  # Only needed if the token file has no VIN (the tool records one).
  vin: ""
  # Renew on this app's own timer, in seconds. 0 disables the scheduler and leaves
  # triggering to Home Assistant (or to you). 6000s sits inside the ~2h window a
  # *freshly minted* identity gets, with room for a retry: an install presenting a
  # device id XPENG has seen before is not retired on a timer at all.
  renew_interval: 6000
  # How often to ask Home Assistant whether the credentials are still valid, so a
  # session that dies early is replaced within a few minutes.
  invalid_poll_interval: 300
  # The solver app's container hostname, which is what actually resolves between
  # apps. The old default named the *local-folder* install
  # (local_xpeng_slider_solver); an install from the store gets a
  # repository-hashed name instead, and that name only resolves in its
  # hyphenated hostname form - the underscore slug does NOT
  # ("No address associated with hostname", measured 2026-10-10). Both forms
  # were exercised on a live install; only this one worked.
  solver_url: "http://571f4c18-xpeng-slider-solver:8080"
  solver_token: ""
  renew_token: ""
  # Send a persistent notification after every successful renewal. Failures still
  # notify after two consecutive attempts either way. Turn this off on an install
  # that renews on its own timer and does not want a card every interval.
  notify_on_success: true
  pair_dir: "/config/xpeng-secrets"
  # Target one config entry by its id instead of the entry whose title carries
  # this pair's VIN suffix. Only needed when more than one XPENG entry exists,
  # e.g. two cars on two accounts with one instance each (each also needs its own
  # pair_dir). Leave empty to match the pair's VIN.
  entry_id: ""
  # What the integration is allowed to do to the car, set when this app creates
  # the config entry on a fresh install (Home Assistant's own setup form asks
  # the same question when a person does it). One of: read_only, safe, safe_plus,
  # full (`charging` is the old name for safe_plus and still accepted).
  # safe_plus is the default: climate, lights, locking and charging, with
  # unlocking, the trunk/windows, OTA and raw commands left off. `full` is what
  # the integration did before this option existed. Change it later under the
  # integration's Configure screen.
  command_mode: safe_plus
schema:
  email: email
  password: password
  device_id: str?
  vin: str?
  renew_interval: int?
  invalid_poll_interval: int?
  solver_url: url
  solver_token: password
  renew_token: password
  notify_on_success: bool?
  pair_dir: str
  entry_id: str?
  command_mode: list(read_only|safe|safe_plus|charging|full)
