        text:
          multiline: true

clear_stuck_commands:
  name: Clear stuck commands
  description: >-
    Clear the server-side pending vehicle command queue. Use when the car
    returns code:12 ("Vehicle controls in used"), e.g. after rapid command
    bursts. Calls REST vehicleCmdClear; only affects your own account.
  fields:
    vehicle_entity_id:
      name: Vehicle entity
      description: >-
        Any entity of the car to target. Omit it only on a single-car
        install; with several, the call would otherwise act on the first
        entry.
      selector:
        entity:
          integration: xpeng

capture_snapshot:
  name: Capture state snapshot
  description: >-
    Write a JSON snapshot of every coordinator-tracked XPENG field to
    <config>/xpeng_snapshots/<vin>_<timestamp>.json. Also auto-fires on
    detected xos_version change so each OTA update produces a before/after
    pair. Useful for diffing across XOS updates.
  fields:
    vehicle_entity_id:
      name: Vehicle entity
      description: >-
        Any entity of the car to target. Omit it only on a single-car
        install; with several, the call would otherwise act on the first
        entry.
      selector:
        entity:
          integration: xpeng
    reason:
      name: Reason
      description: Free-form label stored in the snapshot file (e.g. "pre_xos_update")
      example: "pre_xos_update"
      default: "manual"
      selector:
        text:

create_hvac_schedule:
  name: Create HVAC schedule
  description: >-
    Create a scheduled HVAC (climate) appointment on the vehicle. Empty
    days_of_week means run once at the next occurrence.
  fields:
    vehicle_entity_id:
      name: Vehicle entity
      description: An XPENG entity belonging to the vehicle. Required when several cars are configured.
      selector:
        entity:
          integration: xpeng
    start_time:
      name: Start time
      description: Local start time in HH:MM (24h)
      example: "07:30"
      required: true
      selector:
        text:
    days_of_week:
      name: Days of week
      description: >-
        List of weekday numbers (1=Mon..7=Sun) for recurring schedules. Empty
        list = one-shot.
      example: "[1, 2, 3, 4, 5]"
      default: []
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "1"
            - label: Tuesday
              value: "2"
            - label: Wednesday
              value: "3"
            - label: Thursday
              value: "4"
            - label: Friday
              value: "5"
            - label: Saturday
              value: "6"
            - label: Sunday
              value: "7"
    enabled:
      name: Enabled
      description: Whether the schedule starts active
      default: true
      selector:
        boolean:
    action_type:
      name: Action type
      description: Backend actionType string (advanced)
      default: AIR_CONDITION_OPEN
      selector:
        text:
    time_zone:
      name: Time zone
      description: Optional IANA time zone (e.g. Europe/London)
      example: Europe/London
      selector:
        text:

update_hvac_schedule:
  name: Update HVAC schedule
  description: Update an existing HVAC scheduled appointment by id.
  fields:
