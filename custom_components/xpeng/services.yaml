            - label: Wednesday
              value: "3"
            - label: Thursday
              value: "4"
            - label: Friday
              value: "5"
            - label: Saturday
              value: "6"
            - label: Sunday
              value: "7"
    enabled:
      name: Enabled
      description: Whether the schedule is active
      default: true
      selector:
        boolean:
    action_type:
