send_navigation:
  name: Send navigation
  description: >-
    Send a navigation destination card to the vehicle's head unit. Backs the
    official app's "send POI to car" feature via the cloud REST channel.
  fields:
    vehicle_entity_id:
      name: Vehicle entity
      description: >-
        Any entity of the car to target. Omit it only on a single-car
        install; with several, the call would otherwise act on the first
        entry.
      selector:
        entity:
          integration: xpeng
    name:
      name: Name
      description: Destination name shown on the vehicle screen
      required: true
      example: Home
    latitude:
      name: Latitude
      description: Destination latitude (WGS84)
      required: true
      example: 51.5074
      selector:
        number:
          min: -90
          max: 90
          mode: box
    longitude:
      name: Longitude
      description: Destination longitude (WGS84)
      required: true
      example: -0.1278
      selector:
        number:
          min: -180
          max: 180
          mode: box
    label:
      name: Label
      description: Optional category label for the navigation card
      example: Home
    poi_id:
      name: POI ID
      description: Optional POI identifier from a POI search
      example: "12345"
    msg_type:
      name: Message type
      description: >-
        Optional message type sent to the server. Leave blank to omit.
      example: "2"

