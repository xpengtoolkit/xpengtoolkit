charging_hint:
  name: Charging hint
  description: >-
    Tell the integration that an external charger says a charge session may be
    starting, so it polls at the active cadence instead of waiting for the car to
    admit it. Polling only: this never wakes the car - the queries it raises are
    passive - so a wrong hint costs cloud round trips, not battery.
  fields:
    vehicle_entity_id:
      name: Vehicle entity
      description: >-
        Any entity of the car to target. Omit it only on a single-car
        install; with several, the call would otherwise act on the first
        entry.
      selector:
        entity:
          integration: xpeng
    duration_minutes:
      name: Duration in minutes
      description: >-
        How long the hint stays armed. Call it again to extend, or pass 0 to clear
        it. Capped at 240 minutes.
      default: 30
      example: 30
      selector:
        number:
          min: 0
          max: 240
          mode: box

climate_on:
  name: Climate ON
  description: Turn on climate control
  fields:
    vehicle_entity_id:
      name: Vehicle entity
      description: >-
        Any entity of the car to target. Omit it only on a single-car
        install; with several, the call would otherwise act on the first
        entry.
      selector:
        entity:
          integration: xpeng
    temperature:
      name: Temperature
      description: Target temperature in Celsius; LO/HI endpoints require vehicle support
      default: 22.0
      example: 21.5
      selector:
        number:
          min: 15.5
          max: 32.5
          step: 0.5
          unit_of_measurement: "\u00b0C"
    duration:
      name: Duration
      description: Run time in minutes
      default: 15
      example: 15
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

